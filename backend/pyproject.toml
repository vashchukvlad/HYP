[project]
name = "ai-impact-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29", "alembic>=1.13", "pydantic[email]>=2.8", "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7", "bcrypt<4.1",
  "pandas>=2.2", "python-multipart>=0.0.9"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiosqlite>=0.20"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
