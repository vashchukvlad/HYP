services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_impact
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_impact"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_impact
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: http://localhost:8000 }
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
